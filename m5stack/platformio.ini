; PokeSveglia M5 - sveglia Pokémon per M5Stack Core2 for AWS IoT EduKit
;
; Comandi utili (dalla barra di PlatformIO in VS Code):
;   1. "Build Filesystem Image" + "Upload Filesystem Image"  -> carica le GIF della cartella data/
;   2. "Upload"                                              -> carica il firmware
;   3. "Monitor"                                             -> messaggi di debug (115200 baud)

[env:pokesveglia-m5]
platform = espressif32@6.10.0
board = m5stack-core2
framework = arduino

; ESP32 con 16 MB flash + 8 MB PSRAM
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    m5stack/M5Unified@0.2.7
    bitbank2/AnimatedGIF@2.2.0
    bblanchon/ArduinoJson@7.4.2
    earlephilhower/ESP8266Audio@1.9.7
    adafruit/Adafruit NeoPixel@1.12.3
