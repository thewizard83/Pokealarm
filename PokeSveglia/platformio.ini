; PokeSveglia - sveglia Pokémon per il robot XiaoZhi ESP32-S3 1.28" (Spotpear 1.28-BOX)
;
; Comandi utili (dalla barra di PlatformIO in VS Code):
;   1. "Build Filesystem Image" + "Upload Filesystem Image"  -> carica le GIF della cartella data/
;   2. "Upload"                                              -> carica il firmware
;   3. "Monitor"                                             -> messaggi di debug (115200 baud)

[env:pokesveglia]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 N16R8: 16 MB flash (QIO) + 8 MB PSRAM (OPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    lovyan03/LovyanGFX@1.2.7
    bitbank2/AnimatedGIF@2.2.0
    bblanchon/ArduinoJson@7.4.2
    earlephilhower/ESP8266Audio@1.9.7
